spring:
  application:
    name: daily-history-server

  main:
    lazy-initialization: true

  datasource:
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        query:
          plan_cache_max_size: 128
          plan_parameter_metadata_max_size: 32
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true


server:
  # The daily-content responses are ~400 KB of JSON each and were going out
  # uncompressed: the client fetches four days before it can paint, so a phone was
  # pulling ~1.6 MB before showing a single story. JSON gzips to roughly a tenth.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  port: ${PORT:8080}
  jwtSecret: ${SERVER_JWTSECRET}
  jwtExpirationMs: ${SERVER_JWTEXPIRATIONMS:2592000000}
  pipelineSecret: ${PIPELINE_SECRET}
  tomcat:
    threads:
      max: 25
      min-spare: 2
    max-connections: 200
    accept-count: 50
    connection-timeout: 20000

google:
  oauth:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS}

apple:
  bundle-id: ${APPLE_BUNDLE_ID}

cloudinary:
  cloudName: ${CLOUDINARY_CLOUD_NAME}
  apiKey: ${CLOUDINARY_API_KEY}
  apiSecret: ${CLOUDINARY_API_SECRET}
  folder: ${CLOUDINARY_FOLDER:daily-history}

app:
  support:
    to: ${SUPPORT_ADMIN_EMAIL}

resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

revenuecat:
  secret-key: ${REVENUECAT_SECRET_KEY}
  webhook-auth-header: ${REVENUECAT_WEBHOOK_AUTH_HEADER}
